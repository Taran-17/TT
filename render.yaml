services:
  - type: web
    name: techtailor-prototype
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: techtailor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: techtailor-redis
          property: connectionString

  # Render calls this product "Key Value" in the dashboard now, but it's
  # still declared as `type: redis` in render.yaml and speaks the Redis
  # protocol - the app just needs a REDIS_URL, so it works either way.
  - type: redis
    name: techtailor-redis
    ipAllowList: []
    plan: starter

databases:
  - name: techtailor-db
    plan: starter
